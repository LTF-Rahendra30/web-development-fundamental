<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS variable</title>
    <style>
        :root{
            --brand-color: rgb(250, 92, 92);
        }

        main{
            font-size: 2rem;
        }
        h1{
            color: var(--brand-color);
        }
    </style>
</head>
<body>
    <h1>Try CSS variable</h1>

    <main>
        <section>
            <a href="#">Home</a>
        </section>
    </main>
</body>
</html>
